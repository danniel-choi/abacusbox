name: AI quality gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Read-only audit and preview gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safe quality gate
        env:
          AI_BASE_REF: ${{ github.event.before || 'HEAD~1' }}
        run: npm run ai:quality

