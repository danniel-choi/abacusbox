name: AI quality gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Automatic quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safe quality gate
        env:
          AI_BASE_REF: ${{ github.event.before || 'HEAD~1' }}
          AI_ALLOW_PROTECTED_CHANGES: "true"
        run: npm run ai:quality

  deploy:
    name: Automatic Cloudflare Pages production deploy
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply calcrule-prod --remote --config wrangler.toml

      - name: Build production site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_DISPLAY_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_DISPLAY_SLOT }}
          NEXT_PUBLIC_ADSENSE_TOP_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_TOP_SLOT }}
          NEXT_PUBLIC_ADSENSE_CALCULATOR_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_CALCULATOR_SLOT }}
          NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_IN_ARTICLE_SLOT }}
          NEXT_PUBLIC_ADSENSE_BOTTOM_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_BOTTOM_SLOT }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy out
          --project-name calcrule
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.event.head_commit.message || github.workflow }}"

  deploy-scheduler:
    name: Automatic blog scheduler Worker deploy
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy blog scheduler Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config scheduler/wrangler.jsonc

