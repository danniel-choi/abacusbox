name: Google measurement snapshot

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Read-only Google data snapshot
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect read-only snapshot
        env:
          AI_ALLOW_EXTERNAL_READ: "1"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID || vars.GA4_PROPERTY_ID }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL || vars.SEARCH_CONSOLE_SITE_URL }}
          ADSENSE_ACCOUNT_ID: ${{ secrets.ADSENSE_ACCOUNT_ID || vars.ADSENSE_ACCOUNT_ID }}
        run: |
          service_account_configured="no"
          property_configured="no"
          search_console_configured="no"
          [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && service_account_configured="yes"
          [ -n "$GA4_PROPERTY_ID" ] && property_configured="yes"
          [ -n "$SEARCH_CONSOLE_SITE_URL" ] && search_console_configured="yes"
          echo "Google measurement configuration: service-account=$service_account_configured, ga4-property=$property_configured, search-console=$search_console_configured"
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GA4_PROPERTY_ID" ] || [ -z "$SEARCH_CONSOLE_SITE_URL" ]; then
            echo "Google 측정 시크릿 또는 속성값이 등록되지 않아 이번 실행은 대기 상태로 종료합니다."
            exit 0
          fi
          npm run ai:google-data-snapshot

      - name: Generate revenue KPI report
        if: hashFiles('.ai-reports/google-data-*.json') != ''
        run: npm run ai:revenue-report

      - name: Upload sanitized snapshot artifact
        if: hashFiles('.ai-reports/google-data-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: google-measurement-${{ github.run_id }}
          path: .ai-reports/google-data-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload revenue KPI report
        if: hashFiles('.ai-reports/revenue-kpi-*.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: revenue-kpi-${{ github.run_id }}
          path: .ai-reports/revenue-kpi-*.md
          if-no-files-found: error
          retention-days: 30
